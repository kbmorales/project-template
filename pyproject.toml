[project]
name = "project-template"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pkg"]

[tool.uv.workspace]
members = [
    ".",
]

[tools.uv]
package = true

[tool.uv.sources]
pkg = { workspace = true, editable = true }